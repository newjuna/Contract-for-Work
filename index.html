<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도급 안전관리</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body>
<div id="loginView" class="lv" hidden><main class="lbox">
  <div class="lbrand"><i aria-hidden="true"></i>도급 안전관리</div>
  <h1>로그인</h1>
  <p class="lsub" id="loginSub">접속 구분을 고른 뒤 Google 계정으로 로그인하세요.</p>
  <fieldset class="lseg" id="modeBox"><legend>접속 구분</legend>
    <label><input type="radio" name="loginMode" value="VENDOR" checked><span>협력업체</span></label>
    <label><input type="radio" name="loginMode" value="STAFF"><span>다이소 담당자</span></label>
  </fieldset>
  <div id="googleBtn"></div>
  <p id="loginStatus" class="lstatus" role="status" aria-live="polite"></p>
  <div class="lhelp" id="loginHelp"></div>
  <div class="lver" id="loginVer">&nbsp;</div>
</main></div>
<div id="appView" hidden><div class="cover" id="cover" role="status" aria-live="polite"><div class="loadbox"><div id="loadMsg">처리 중입니다</div><div class="loadbar"><span id="loadBar"></span></div><div class="loadpct"><span id="loadPct">0</span>%</div><div class="muted" id="loadHint">잠시만 기다려 주세요</div></div></div><header class="topbar"><div class="tb-in"><div class="brand"><span class="dot" aria-hidden="true"></span><b>도급 안전관리</b></div><div class="tb-r"><span id="pageTitle" class="ptitle"></span><button id="gearBtn" class="gearbtn" type="button" hidden aria-label="마스터 설정 (직원 관리)" title="마스터 설정 · 직원 관리" onclick="openMaster()">⚙</button><button id="menuBtn" class="menubtn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer" onclick="toggleMenu()"><span></span><span></span><span></span></button></div></div></header><div id="scrim" class="scrim" onclick="toggleMenu(false)"></div><aside id="drawer" class="drawer" aria-label="메뉴" aria-hidden="true"><div class="dr-head"><b>메뉴</b><button class="xbtn" type="button" onclick="toggleMenu(false)" aria-label="메뉴 닫기">✕</button></div><div id="identity" class="who">Google 계정 확인 중...</div><nav class="tabs"><button id="myTab" class="active" onclick="switchTab('my')">내 업무</button><button id="adminTab" class="hidden" onclick="switchTab('admin')">사업자 승인</button><button id="reviewTab" class="hidden" onclick="switchTab('review')">제출자료 검토</button><button id="tplTab" class="hidden" onclick="switchTab('tpl')">표준양식 관리</button><button id="jobsTab" class="hidden" onclick="switchTab('jobs')">공사·현장미팅</button><button id="staffTab" class="hidden" onclick="switchTab('staff')">직원 관리</button></nav><button class="logout" type="button" onclick="logout()">로그아웃 · 접속 구분 바꾸기</button><div class="dr-foot">아성다이소 안전보건팀 · <span class="verTxt"></span></div></aside><main class="main"><section id="my"></section><section id="admin" class="hidden"></section><section id="review" class="hidden"></section><section id="tpl" class="hidden"></section><section id="staff" class="hidden"></section><section id="jobs" class="hidden"></section><div class="appver verTxt"></div></main><div class="toast" id="toast"></div><div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="position:fixed;inset:0;background:#1b243566;z-index:30;display:none;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:18px;padding:26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px #0003"><h2 id="modalTitle" style="margin:0 0 10px;font-size:20px"></h2><p id="modalBody" class="desc" style="white-space:pre-line;margin:0 0 18px"></p><button id="modalBtn" class="button" type="button" style="width:100%"></button><button id="modalCancel" class="button ghost" type="button" style="width:100%;margin-top:8px" hidden>나중에</button></div></div></div>
<script src="permit.js"></script>
<script src="app.js"></script>
</body></html>
