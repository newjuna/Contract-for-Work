<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도급계약 및 실행 · 구글 로그인</title><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#263144;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}.hero{background:linear-gradient(125deg,#e82c50,#fa627a);height:270px;color:#fff;padding:26px}.top{max-width:950px;margin:auto;font-size:14px;font-weight:700}.card{background:#fff;border-radius:24px;box-shadow:0 14px 45px #19283d18;max-width:480px;margin:-145px auto 50px;position:relative;padding:36px 32px;text-align:center}.logo{border:1px solid #ffced6;color:#e82c50;border-radius:14px;display:inline-block;font-size:15px;font-weight:900;padding:12px;margin-bottom:14px}.card h1{font-size:24px;margin:0 0 12px}.card p{font-size:13px;color:#7d8794;line-height:1.7}.gsi{display:flex;justify-content:center;margin:28px 0}.note{border-radius:13px;padding:14px;background:#f8f9fb;font-size:12px;line-height:1.7;text-align:left;color:#657185}#msg{color:#b92d49;font-size:12px;margin-top:17px}@media(max-width:520px){.card{margin:-145px 15px 40px;padding:25px 20px}}
</style></head><body><div class="hero"><div class="top">ASUNG DAISO　 |　 협력업체 안전보건</div></div><main class="card"><div class="logo">SH</div><h1>도급계약 및 실행 관리</h1><p>등록된 구글 계정으로 로그인하고<br>사업자 등록 신청 및 안전보건정보를 작성합니다.</p><div id="googleButton" class="gsi"></div><div class="note">구글 계정 인증 후 처음 방문한 업체는 사업자 등록을 신청합니다. 본사 담당자 승인과 업체 이메일 인증을 완료해야 업무 작성이 가능합니다.</div><div id="msg"></div></main>
<script>
// 반드시 아래 두 설정값을 실제 값으로 수정하세요.
const GOOGLE_CLIENT_ID='694588672504-0kogumff80pum5iu07eebrili8kmec1h.apps.googleusercontent.com';
const APPS_SCRIPT_EXEC_URL='PASTE_APPS_SCRIPT_EXEC_URL_HERE';
function login(resp){if(!resp.credential){document.getElementById('msg').textContent='구글 로그인 정보를 받지 못했습니다.';return;}if(!APPS_SCRIPT_EXEC_URL.startsWith('https://script.google.com/macros/s/')){document.getElementById('msg').textContent='Apps Script 배포 주소가 아직 설정되지 않았습니다.';return;}document.getElementById('msg').textContent='구글 계정을 확인하고 있습니다...';const f=document.createElement('form');f.method='POST';f.action=APPS_SCRIPT_EXEC_URL;const i=document.createElement('input');i.type='hidden';i.name='credential';i.value=resp.credential;f.appendChild(i);document.body.appendChild(f);f.submit();}
window.addEventListener('load',()=>{if(!GOOGLE_CLIENT_ID.endsWith('.apps.googleusercontent.com')){document.getElementById('msg').textContent='관리자가 Google 로그인 Client ID를 설정해야 합니다.';return;}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:login,auto_select:false});google.accounts.id.renderButton(document.getElementById('googleButton'),{type:'standard',theme:'outline',size:'large',text:'signin_with',width:280});});
</script></body></html>
